<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log Aktivitas DNS</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Log DNS">
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #f2f4f8; overflow: hidden; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); background: #1f3a5f; }
  iframe { position: fixed; top: env(safe-area-inset-top); left: 0; width: 100%; height: calc(100% - env(safe-area-inset-top)); border: 0; background: #f2f4f8; opacity: 0; transition: opacity .4s; }
  iframe.ready { opacity: 1; }
  .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f2f4f8; font: 600 13px system-ui, sans-serif; color: #6a7386; text-align: center; }
  .boot img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 14px; box-shadow: 0 8px 24px rgba(31,58,95,.25); }
  .dots { display: flex; gap: 7px; justify-content: center; margin: 4px 0 10px; height: 24px; align-items: flex-end; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; background: #1f5fbf; animation: j .9s infinite cubic-bezier(.45,0,.55,1); }
  .dots i:nth-child(2) { animation-delay: .15s; background: #3b82f6; }
  .dots i:nth-child(3) { animation-delay: .3s; background: #60a5fa; }
  @keyframes j { 0%,60%,100% { transform: translateY(0) } 30% { transform: translateY(-13px) } }
  .off { display: none; color: #c42f2f; margin-top: 8px; }
  .off button { margin-top: 10px; border: 0; background: #1f5fbf; color: #fff; padding: 10px 18px; border-radius: 10px; font: 600 14px system-ui; }
</style>
</head>
<body>
  <div class="boot" id="boot"><div>
    <img src="icon-192.png" alt="">
    <div class="dots"><i></i><i></i><i></i></div>Membuka Log Aktivitas DNS…
    <div class="off" id="off">Tidak ada koneksi internet.<br><button onclick="location.reload()">Coba lagi</button></div>
  </div></div>

  <!-- GANTI src dengan URL web app Apps Script (berakhiran /exec) -->
  <iframe id="app"
    src="https://script.google.com/macros/s/GANTI_DENGAN_ID_DEPLOYMENT/exec"
    allow="clipboard-read; clipboard-write; camera"
    onload="this.classList.add('ready'); document.getElementById('boot').style.display='none';"></iframe>

<script>
  if (!navigator.onLine) document.getElementById('off').style.display = 'block';
  addEventListener('online', () => location.reload());
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
